name: CD

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  # The release stays a draft until every target is uploaded, so the self-updater never sees a
  # release that is missing the archive for its platform.
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null ||
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --generate-notes

  publish:
    name: Publishing ${{ matrix.target }}
    needs: create-release
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            dependencies: "libssl-dev libasound2-dev libdbus-1-dev libxcb-shape0-dev libxcb-xfixes0-dev"
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross_arch: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.dependencies
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.dependencies }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross_arch
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build
        run: ${{ matrix.cross_arch && 'cross' || 'cargo' }} build --locked --release --target ${{ matrix.target }} -p spotify_player --features image,self-update

      - name: Package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          case ${{ matrix.target }} in
          *-pc-windows-*)
            mv spotify_player.exe spoti.exe
            7z -y a spoti-${{ matrix.target }}.zip spoti.exe
            sha256sum spoti-${{ matrix.target }}.zip > spoti-${{ matrix.target }}.sha256
            ;;
          *)
            mv spotify_player spoti
            tar czvf spoti-${{ matrix.target }}.tar.gz spoti
            shasum -a 256 spoti-${{ matrix.target }}.tar.gz > spoti-${{ matrix.target }}.sha256
            ;;
          esac;

      - name: Upload
        shell: bash
        run: gh release upload "$GITHUB_REF_NAME" target/${{ matrix.target }}/release/spoti-${{ matrix.target }}.* --repo "$GITHUB_REPOSITORY" --clobber

  publish-release:
    name: Publish release
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
